name: Deploy a GitHub Pages

# se ejecuta con push a main o a mano desde la pestana actions
on:
  push:
    branches: [main]
  workflow_dispatch:

# permisos que necesita github para publicar la pagina
permissions:
  contents: read
  pages: write
  id-token: write

# evita que dos deploys corran al mismo tiempo
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # primer trabajo, compila y sube la carpeta dist
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  # segundo trabajo, publica cuando build ya termino
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4